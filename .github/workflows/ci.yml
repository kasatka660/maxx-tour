name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      # `next build` type-checks as well, so this is the type-check gate too.
      # Telegram credentials are only read at request time, not during the
      # build, so none are needed here.
      - run: npm run build
